name: Actualizar datos de criminalidad

# Refresca datos de datos.gov.co (Socrata) cada 6 horas y publica el resultado
# (dist/js/data.js, dist/data/colombia_crimen.json) en ESTE mismo repo público —
# nada más. Existe solo para que el cron corra gratis e ilimitado en Actions.
# El repo privado del dashboard (Angelsistemas7/CrimenAi) tiene su propio workflow
# que lee estos archivos (repo público = lectura sin autenticación) y los
# incorpora con su propio GITHUB_TOKEN. No hace falta ningún token/secret aquí.
#
# Los ~50 JSON crudos de data/ (ver .gitignore) NO se versionan: se regeneran
# desde cero en cada corrida, son build cache, no hace falta duplicarlos en git.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar datos crudos (Socrata, agregados vía SoQL)
        run: node fetch_raw.js
        working-directory: data

      - name: Descargar población municipal DANE (para tasas por 100.000 hab.)
        run: node fetch_poblacion.js
        working-directory: data

      - name: Fusionar datos (10 categorías SIEDCO)
        run: node merge.js
        working-directory: data

      - name: Aplicar parche Fiscalía (SPOA) + Medicina Legal (SIRDEC)
        run: node patch_fiscalia_ubpd.js
        working-directory: data

      - name: Detectar cambios reales (ignora meta.generado, que cambia siempre)
        id: changes
        run: |
          if git show HEAD:dist/data/colombia_crimen.json > /tmp/old.json 2>/dev/null; then
            jq 'del(.meta.generado)' /tmp/old.json > /tmp/old_norm.json
          else
            echo '{}' > /tmp/old_norm.json
          fi
          jq 'del(.meta.generado)' dist/data/colombia_crimen.json > /tmp/new_norm.json
          if diff -q /tmp/old_norm.json /tmp/new_norm.json > /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push si hubo cambios reales
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Actualiza datos de criminalidad ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
          git push
