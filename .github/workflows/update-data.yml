name: Actualizar datos de criminalidad

# Refresca datos de datos.gov.co (Socrata) cada 6 horas y publica el resultado en el
# repo privado del dashboard (Angelsistemas7/CrimenAi). Este repo es público solo para
# que el cron corra gratis e ilimitado en Actions; el dashboard vive aparte, privado.
# Requiere el secret PRIVATE_REPO_TOKEN (fine-grained PAT con permiso Contents: write
# solo sobre Angelsistemas7/CrimenAi) — ver README.md de este repo para cómo generarlo.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scraper
        uses: actions/checkout@v4
        with:
          path: scraper
          fetch-depth: 1

      - name: Checkout dashboard privado
        uses: actions/checkout@v4
        with:
          repository: Angelsistemas7/CrimenAi
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: dashboard
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar datos crudos (Socrata, agregados vía SoQL)
        run: node fetch_raw.js
        working-directory: scraper/data

      - name: Descargar población municipal DANE (para tasas por 100.000 hab.)
        run: node fetch_poblacion.js
        working-directory: scraper/data

      - name: Fusionar datos (10 categorías SIEDCO)
        run: node merge.js
        working-directory: scraper/data

      - name: Aplicar parche Fiscalía (SPOA) + Medicina Legal (SIRDEC)
        run: node patch_fiscalia_ubpd.js
        working-directory: scraper/data

      - name: Copiar resultado al checkout del dashboard privado
        run: |
          cp scraper/dist/js/data.js dashboard/js/data.js
          cp scraper/dist/data/colombia_crimen.json dashboard/data/colombia_crimen.json
          node -e "
            const fs = require('fs');
            const p = 'dashboard/index.html';
            const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            let html = fs.readFileSync(p, 'utf8');
            html = html.replace(/(js\/data\.js\?v=)\d{8}/, '\$1' + stamp);
            fs.writeFileSync(p, html);
          "

      - name: Detectar cambios
        id: changes
        working-directory: dashboard
        run: |
          if git diff --quiet -- data/colombia_crimen.json js/data.js index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push al repo privado si hubo cambios
        if: steps.changes.outputs.changed == 'true'
        working-directory: dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/colombia_crimen.json js/data.js index.html
          git commit -m "Actualiza datos de criminalidad ($(date -u +%Y-%m-%d\ %H:%M\ UTC))"
          git push
